<div class="carousel-container" #carousel>
  @if (totalPages > 1) {
    <div class="left z-1 cursor" (click)="currentPage != 1 && changePage(-1)"
      [ngClass]="{ disabled: currentPage === 1 }">
      <span>
        <i class="fa fa-angle-left" aria-hidden="true"></i>
      </span>
    </div>
  }
  <div class="rev-cards cards" [ngClass]="{ 'w-100': totalPages === 1 }">
    <div class="overflow" [style.width]="overflowWidth" [style.left]="pagePosition">
      @for (subTopic of subTopics; track subTopic; let i = $index) {
        <div class="rev-card card my-3 br-12"
          [style.width]="cardWidth"
          (click)="watchVideo(subTopic)">
          <div class="rev-card__media">
            <img class="img-fluid br-14" alt="Revelation Part {{ i + 1 }}" src="../../../assets/img/revelation/Revelation 0{{ i + 1 }}.jpg"
              loading="lazy" />
            <div class="rev-card__overlay">
              <span class="rev-card__play"><i class="fa fa-play"></i></span>
            </div>
          </div>
          <div class="card-body">
            <h5 class="card-title">Revelation Part - {{ i + 1 }}</h5>
            <p class="card-text">
              <span class="rev-card__watch cursor">
                <i class="fa fa-play"></i> Watch Video
              </span>
            </p>
          </div>
        </div>
      }
    </div>
  </div>
  @if (totalPages > 1) {
    <div class="right cursor" (click)="currentPage != totalPages && changePage(+1)"
      [ngClass]="{ disabled: currentPage === totalPages }">
      <span>
        <i class="fa fa-angle-right" aria-hidden="true"></i>
      </span>
    </div>
  }
</div>
