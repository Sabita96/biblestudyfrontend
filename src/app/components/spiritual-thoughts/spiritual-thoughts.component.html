<div class="thoughts-page" id="thoughts-section">
  <div class="thoughts-header text-center">
    <h2 class="title move-up">Spiritual Thoughts</h2>
    <p class="subtitle">A gallery of encouraging thoughts in English, Tamil, Hindi &amp; Marathi</p>
  </div>

  <div class="lang-tabs" role="tablist" aria-label="Gallery language">
    @for (lang of languages; track lang.id) {
      <button
        type="button"
        role="tab"
        class="lang-tab"
        [class.active]="activeLanguage.id === lang.id"
        [attr.aria-selected]="activeLanguage.id === lang.id"
        (click)="selectLanguage(lang)"
      >
        <span class="lang-tab__label">{{ lang.label }}</span>
        <span class="lang-tab__count">{{ lang.images.length }}</span>
      </button>
    }
  </div>

  <div class="gallery-grid" role="tabpanel">
    @for (img of activeLanguage.images; track img; let i = $index) {
      <figure class="gallery-card" (click)="openLightbox(i)">
        <img
          loading="lazy"
          [src]="imagePath(activeLanguage, img)"
          alt="Spiritual Truth Bible Study"
        />
        <figcaption class="gallery-card__overlay">
          <svg viewBox="0 0 24 24" class="gallery-card__icon">
            <path
              d="M15.5,14H14.71L14.43,13.73C15.41,12.59 16,11.11 16,9.5A6.5,6.5 0 0,0 9.5,3A6.5,6.5 0 0,0 3,9.5A6.5,6.5 0 0,0 9.5,16C11.11,16 12.59,15.41 13.73,14.43L14,14.71V15.5L19,20.49L20.49,19L15.5,14M9.5,14C7.01,14 5,11.99 5,9.5C5,7.01 7.01,5 9.5,5C11.99,5 14,7.01 14,9.5C14,11.99 11.99,14 9.5,14Z"
            />
          </svg>
        </figcaption>
      </figure>
    } @empty {
      <p class="gallery-empty">No images available for this language yet.</p>
    }
  </div>
</div>

@if (lightboxOpen) {
  <div class="lightbox-overlay" (click)="closeLightbox()">
    <button
      type="button"
      class="lightbox-close"
      aria-label="Close"
      (click)="closeLightbox()"
    >
      &times;
    </button>

    <button
      type="button"
      class="lightbox-nav lightbox-nav--prev"
      aria-label="Previous image"
      (click)="showPrev(); $event.stopPropagation()"
    >
      &#10094;
    </button>

    <div class="lightbox-content" (click)="$event.stopPropagation()">
      <img [src]="currentLightboxSrc" alt="Spiritual Truth Bible Study" />
      <a
        class="lightbox-download"
        [href]="currentLightboxSrc"
        [download]="currentLightboxImage"
        title="Download image"
      >
        Download
      </a>
    </div>

    <button
      type="button"
      class="lightbox-nav lightbox-nav--next"
      aria-label="Next image"
      (click)="showNext(); $event.stopPropagation()"
    >
      &#10095;
    </button>
  </div>
}
