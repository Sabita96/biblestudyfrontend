<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1200">
  @for (toast of toastService.toasts; track toast.id) {
    <ngb-toast
      [class]="toast.classname"
      [header]="toast.header"
      [autohide]="true"
      [delay]="toast.delay"
      (hidden)="toastService.remove(toast)"
    >
      {{ toast.body }}
    </ngb-toast>
  }
</div>
